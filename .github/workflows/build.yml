name: Build Cratebook
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/visual-comparison/**'
      - 'docs/visual-specifications.md'
      - 'AGENTS.md'
  pull_request:
    paths-ignore:
      - 'docs/visual-comparison/**'
      - 'docs/visual-specifications.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: desktop-release
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rustc --version --verbose
      - run: cargo fmt --all --check
        if: runner.os == 'macOS'
      - run: cargo test --locked --release
  windows:
    name: Packaged Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-static-release
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build portable Windows distribution
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cratebook-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  package:
    name: Packaged macOS executable
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: desktop-release
          cache-workspace-crates: true
          cache-bin: false
          save-if: false
      - name: Build the registry package on macOS
        run: |
          cargo package --locked --no-verify
          tar -xzf target/package/cratebook-*.crate -C "$RUNNER_TEMP"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          cargo build --locked --release --bin cratebook --manifest-path "$RUNNER_TEMP/cratebook-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)/Cargo.toml"
      - name: Archive the tested native binary
        run: tar -czf "$RUNNER_TEMP/cratebook-macos.tar.gz" -C target/release cratebook
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cratebook-macos
          path: ${{ runner.temp }}/cratebook-macos.tar.gz

  web:
    name: WebAssembly gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: wasm-release
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install matching wasm-bindgen CLI
        run: |
          archive=wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
          curl --fail --location --retry 3 "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/$archive" -o "$RUNNER_TEMP/$archive"
          cd "$RUNNER_TEMP"
          echo "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  $archive" | sha256sum --check
          tar -xzf "$archive"
          install -m755 "${archive%.tar.gz}/wasm-bindgen" "$HOME/.cargo/bin/wasm-bindgen"
      - run: scripts/build-web.sh
      - name: Package and test the npm CLI
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          archive="$RUNNER_TEMP/cratebook-$(node -p "require('./package.json').version").tgz"
          mkdir "$RUNNER_TEMP/consumer"
          npm install --prefix "$RUNNER_TEMP/consumer" --no-audit --no-fund "$archive"
          "$RUNNER_TEMP/consumer/node_modules/.bin/cratebook" --check
          npm publish "$archive" --dry-run --access public
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cratebook-npm
          path: ${{ runner.temp }}/cratebook-*.tgz
          if-no-files-found: error
      - name: Include license notices
        run: |
          mkdir -p web/licenses
          cp LICENSE assets/OFL.txt vendor/gpui-pre-web/LICENSE-APACHE web/licenses/
          cp assets/phosphor/LICENSE web/licenses/Phosphor-MIT.txt
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: web

  deploy:
    name: Publish gallery
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [native, windows, package, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v5.0.1
