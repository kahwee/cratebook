name: Build Cratebook
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'scripts/visual-report.py'
      - '.github/workflows/platform-screenshots.yml'
      - 'AGENTS.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'scripts/visual-report.py'
      - '.github/workflows/platform-screenshots.yml'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: desktop-release
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rustc --version --verbose
      - run: cargo fmt --all --check
        if: runner.os == 'macOS'
      - run: cargo test --locked --release
  windows:
    name: Packaged Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-static-release
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build portable Windows distribution
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cratebook-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  package:
    name: Packaged macOS executable
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: desktop-release
          cache-workspace-crates: true
          cache-bin: false
          save-if: false
      - name: Build the registry package on macOS
        run: |
          cargo package --locked --no-verify
          tar -xzf target/package/cratebook-*.crate -C "$RUNNER_TEMP"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          cargo build --locked --release --bin cratebook --manifest-path "$RUNNER_TEMP/cratebook-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)/Cargo.toml"
      - name: Archive the tested native binary
        run: tar -czf "$RUNNER_TEMP/cratebook-macos.tar.gz" -C target/release cratebook
      - name: Build a Finder app and archive it with its architecture
        run: |
          sh scripts/bundle-macos.sh target/release/cratebook "$RUNNER_TEMP/Cratebook.app"
          archive="$RUNNER_TEMP/cratebook-macos-$(uname -m).zip"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Cratebook.app" "$archive"
          cd "$RUNNER_TEMP"
          shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256"
      - name: Launch the Finder app and observe its native window
        run: |
          bundle="$RUNNER_TEMP/Cratebook.app"
          open -n "$bundle"
          pid=''
          for attempt in $(seq 1 50); do
            pid=$(pgrep -x cratebook | head -1 || true)
            if [ -n "$pid" ]; then break; fi
            sleep 0.2
          done
          test -n "$pid"
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          window=$(swift - "$pid" <<'SWIFT'
          import CoreGraphics
          import Foundation
          let pid = Int(CommandLine.arguments[1])!
          for _ in 0..<100 {
              let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly], 0) as? [[String:Any]] ?? []
              if let window = windows.first(where: { $0["kCGWindowOwnerPID"] as? Int == pid && $0["kCGWindowName"] as? String == "Cratebook" }) {
                  print(window["kCGWindowNumber"]!)
                  exit(0)
              }
              Thread.sleep(forTimeInterval: 0.1)
          }
          exit(1)
          SWIFT
          )
          sw_vers > "$RUNNER_TEMP/macos-app-metadata.txt"
          file "$bundle/Contents/MacOS/cratebook" >> "$RUNNER_TEMP/macos-app-metadata.txt"
          printf 'Native Finder app window observed: pid=%s window=%s\n' "$pid" "$window" >> "$RUNNER_TEMP/macos-app-metadata.txt"
          screencapture -x -o -l "$window" "$RUNNER_TEMP/macos-app-window.png" || true
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cratebook-macos
          path: |
            ${{ runner.temp }}/cratebook-macos.tar.gz
            ${{ runner.temp }}/cratebook-macos-*.zip
            ${{ runner.temp }}/cratebook-macos-*.zip.sha256
            ${{ runner.temp }}/macos-app-metadata.txt
            ${{ runner.temp }}/macos-app-window.png

  web:
    name: WebAssembly gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: wasm-release
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install matching wasm-bindgen CLI
        run: |
          archive=wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
          curl --fail --location --retry 3 "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/$archive" -o "$RUNNER_TEMP/$archive"
          cd "$RUNNER_TEMP"
          echo "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  $archive" | sha256sum --check
          tar -xzf "$archive"
          install -m755 "${archive%.tar.gz}/wasm-bindgen" "$HOME/.cargo/bin/wasm-bindgen"
      - run: scripts/build-web.sh
      - name: Package and test the npm CLI
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          archive="$RUNNER_TEMP/cratebook-$(node -p "require('./package.json').version").tgz"
          mkdir "$RUNNER_TEMP/consumer"
          npm install --prefix "$RUNNER_TEMP/consumer" --no-audit --no-fund "$archive"
          "$RUNNER_TEMP/consumer/node_modules/.bin/cratebook" --check
          npm publish "$archive" --dry-run --access public
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cratebook-npm
          path: ${{ runner.temp }}/cratebook-*.tgz
          if-no-files-found: error
      - name: Include license notices
        run: |
          mkdir -p web/licenses
          cp LICENSE assets/OFL.txt assets/JetBrainsMono-OFL.txt vendor/gpui-pre-web/LICENSE-APACHE web/licenses/
          cp assets/phosphor/LICENSE web/licenses/Phosphor-MIT.txt
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: web

  deploy:
    name: Publish gallery
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [native, windows, package, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v5.0.1
