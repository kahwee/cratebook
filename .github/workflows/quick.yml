name: Quick feedback
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Format and manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cargo fmt --all --check
      - run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Test Rust source highlighting
        run: |
          printf '%s\n' '#[path = "src/gallery/syntax.rs"] mod syntax;' | rustc --edition 2024 --test - -o "$RUNNER_TEMP/syntax-tests"
          "$RUNNER_TEMP/syntax-tests"
